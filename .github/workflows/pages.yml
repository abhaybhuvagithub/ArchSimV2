name: Pages

# Deploys the studio by pushing the built site to the `gh-pages` branch — the
# same mechanism ArchSim 1.x uses, and the one that needs no repository setting
# flipped by hand first. `actions/deploy-pages` is the more modern route, but it
# requires Settings → Pages → Source: GitHub Actions to have been set, and a
# deploy that cannot run until somebody clicks something is a deploy that reports
# red for a week.
#
# Separate from CI on purpose: publishing is not a test, and a publishing problem
# must never be reported as a broken build.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publish only what passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      # v1 learned this the hard way: a deploy that reuses a stale checkout can
      # ship the *previous* build. Publish from a directory built in this run,
      # and assert the bundle the page references actually exists before pushing.
      - name: verify the built site before publishing
        run: |
          set -e
          test -f apps/canvas/dist/index.html
          ASSET=$(grep -o 'assets/[^"]*\.js' apps/canvas/dist/index.html | head -1)
          test -n "$ASSET"
          test -f "apps/canvas/dist/$ASSET"
          echo "publishing $ASSET"

      - name: publish to gh-pages
        run: |
          set -e
          cp -r apps/canvas/dist /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "studio built from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
